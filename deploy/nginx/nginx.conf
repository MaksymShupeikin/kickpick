worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 15s;

    # Shared-memory zones cover all Nginx and API workers on this host.
    # Forwarded client-IP headers are deliberately not trusted by default.
    include /etc/nginx/trusted-proxies.conf;
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=search_ip:10m rate=2r/s;
    limit_req_zone $server_name zone=search_all:1m rate=8r/s;
    limit_req_zone $server_name zone=all_clients:1m rate=80r/s;
    map $uri $season_key {
        default "";
        ~^/competitions/[^/]+/matches/?$ $server_name;
    }
    limit_req_zone $season_key zone=season_all:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connections_ip:10m;
    limit_conn_zone $server_name zone=connections_all:1m;
    limit_req_status 429;
    limit_conn_status 429;

    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream api {
        zone api 64k;
        server api:8000 resolve;
        keepalive 8;
    }
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;

    server {
        listen 8080;
        server_name kickpick;
        include /etc/nginx/limits.conf;
        limit_conn connections_ip 16;
        limit_conn connections_all 96;
        error_page 429 = @rate_limited;

        location ~ ^/(status|dashboard|docs|redoc|openapi\.json)(/|$) { return 404; }
        location /search {
            include /etc/nginx/limits.conf;
            limit_req zone=search_ip burst=4 nodelay;
            limit_req zone=search_all burst=8 nodelay;
            proxy_pass http://api;
        }
        location / { proxy_pass http://api; }
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 1 always;
            add_header Cache-Control no-store always;
            return 429 '{"detail":"Too many requests"}';
        }
    }

    # Published only on host loopback, never expose/tunnel this listener.
    server {
        listen 9000;
        server_name kickpick-admin;
        limit_conn connections_all 8;
        location / { proxy_pass http://api; }
    }
}
