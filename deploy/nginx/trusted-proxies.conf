# Only Caddy (profile `public`, fixed address on the `edge` network) may name the client IP: it replaces any
# X-Forwarded-For a client sends. Nothing else is trusted; without Caddy this address never connects.
# Never use `set_real_ip_from 0.0.0.0/0` or trust headers from arbitrary clients.
set_real_ip_from 172.31.255.2;
real_ip_header X-Forwarded-For;
