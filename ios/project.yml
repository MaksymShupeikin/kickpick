name: KickPick
options:
  bundleIdPrefix: app.kickpick
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  KickPick:
    type: application
    platform: iOS
    sources:
      - KickPick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kickpick.KickPick
        TARGETED_DEVICE_FAMILY: "1"
        API_BASE_URL: http://localhost:8000
    info:
      path: KickPick/Info.plist
      properties:
        CFBundleDisplayName: KickPick
        CFBundleDevelopmentRegion: ru
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - BarlowCondensed-SemiBold.ttf
          - BarlowCondensed-Bold.ttf
        APIBaseURL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: KickPick connects to the KickPick server on your local network.
  KickPickTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KickPickTests
    dependencies:
      - target: KickPick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kickpick.KickPickTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KickPick:
    build:
      targets:
        KickPick: all
        KickPickTests: [test]
    test:
      targets:
        - KickPickTests
