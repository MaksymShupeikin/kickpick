services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: kickpick
      POSTGRES_PASSWORD: kickpick
      POSTGRES_DB: kickpick
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kickpick"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
