services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: kickpick
      POSTGRES_PASSWORD: kickpick
      POSTGRES_DB: kickpick
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kickpick"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn kickpick.api:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://kickpick:kickpick@db:5432/kickpick
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  collector:
    build: ./backend
    command: python -m kickpick.collector
    environment:
      DATABASE_URL: postgresql+psycopg://kickpick:kickpick@db:5432/kickpick
      HISTORY_SEASONS: "11"     # newest 11 seasons per competition (2016/17 →); 0 = all FotMob has (since 2010)
      REQUEST_INTERVAL: "0.25"  # seconds between FotMob requests (+0–0.5 s jitter); one request at a time
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
